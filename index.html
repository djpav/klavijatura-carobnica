<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>🎹 Klaviatura Čarobnica</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage" tabindex="0">

  <!-- star bg -->
  <div id="starfield"></div>

  <!-- hud -->
  <div id="hud">
    <div id="logo">🎹 Klaviatura Čarobnica</div>
    <div id="scorebox">
      <div class="pill" id="score-pill">⭐ 0</div>
      <div class="pill" id="combo-pill">🔥 x1</div>
    </div>
  </div>

  <!-- themes -->
  <div id="theme-bar">
    <button class="theme-btn active" data-theme="all"    title="Sve">🌈</button>
    <button class="theme-btn"        data-theme="animals" title="Životinje">🐾</button>
    <button class="theme-btn"        data-theme="food"    title="Hrana">🍕</button>
    <button class="theme-btn"        data-theme="space"   title="Svemir">🚀</button>
    <button class="theme-btn"        data-theme="faces"   title="Smajliji">😀</button>
  </div>

  <button id="spell-toggle" title="Spelovanje na srpskom">🔤</button>

  <div id="tip">Pritisni bilo koji taster ili klikni mišem!</div>
  <div id="swipe-hint">← swipe za promenu teme →</div>
  <div id="theme-toast"></div>

  <!-- start overlay -->
  <div id="overlay">
    <div class="ov-emoji">🎮</div>
    <div class="ov-title">Klaviatura Čarobnica</div>
    <div class="ov-sub">Pritisni bilo koji taster na tastaturi<br>ili klikni mišem — gledaj šta se desi!</div>
    <div class="ov-particles">🐶 🌟 🍕 🚀 😎</div>
    <button id="start-btn">▶ Pokreni!</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
