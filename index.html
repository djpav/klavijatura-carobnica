<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎹 Klaviatura Čarobnica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #07001a;
    --bg2:      #10003a;
    --purple:   #c77dff;
    --pink:     #ff6bb5;
    --yellow:   #ffe066;
    --cyan:     #48dbfb;
    --green:    #6bcb77;
    --orange:   #ff9f43;
    --red:      #ff6b6b;
    --blue:     #4d96ff;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Nunito', 'Comic Sans MS', cursive;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── CANVAS / STAGE ── */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }

  /* ── STAR FIELD ── */
  #starfield {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d) ease-in-out infinite var(--dd);
  }
  @keyframes twinkle {
    0%,100% { opacity: .05; transform: scale(.5); }
    50%      { opacity: .8;  transform: scale(1.3); }
  }

  /* ── HUD ── */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    z-index: 100;
    pointer-events: none;
  }
  #logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(18px, 3vw, 28px);
    color: var(--purple);
    text-shadow: 0 0 24px #c77dff66;
    letter-spacing: 1px;
  }
  #scorebox {
    display: flex; gap: 12px; pointer-events: none;
  }
  .pill {
    padding: 8px 20px;
    border-radius: 999px;
    font-weight: 900;
    font-size: clamp(14px, 2.4vw, 18px);
    border: 2px solid;
    backdrop-filter: blur(6px);
  }
  #score-pill  { border-color: var(--yellow); color: var(--yellow); background: rgba(255,224,102,.1); }
  #combo-pill  { border-color: var(--cyan);   color: var(--cyan);   background: rgba(72,219,251,.1);  }

  /* ── OVERLAY ── */
  #overlay {
    position: absolute; inset: 0; z-index: 500;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1a0050 0%, #07001a 72%);
  }
  #overlay.hidden { display: none; }

  .ov-emoji {
    font-size: clamp(64px, 14vw, 120px);
    animation: float 2s ease-in-out infinite alternate;
  }
  @keyframes float {
    from { transform: translateY(0) rotate(-4deg) scale(1); }
    to   { transform: translateY(-24px) rotate(4deg) scale(1.08); }
  }
  .ov-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(30px, 7vw, 64px);
    color: #fff;
    margin: 18px 0 8px;
    text-align: center;
    text-shadow: 0 0 40px var(--purple);
  }
  .ov-sub {
    font-size: clamp(14px, 2.5vw, 20px);
    color: rgba(255,255,255,.55);
    text-align: center;
    line-height: 1.7;
    max-width: 380px;
  }
  .ov-particles {
    display: flex; gap: 18px; margin: 18px 0 28px;
    font-size: clamp(22px, 5vw, 42px);
    animation: drift 3s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateX(-10px) scale(.95); }
    to   { transform: translateX(10px) scale(1.05); }
  }
  #start-btn {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(18px, 3.5vw, 28px);
    padding: clamp(12px,2vw,18px) clamp(32px,6vw,60px);
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 40px #c77dff55;
    animation: pulse-btn 1.6s ease-in-out infinite;
    letter-spacing: 1px;
  }
  #start-btn:hover { filter: brightness(1.12); }
  @keyframes pulse-btn {
    0%,100% { transform: scale(1); box-shadow: 0 8px 40px #c77dff55; }
    50%      { transform: scale(1.06); box-shadow: 0 8px 60px #c77dffaa; }
  }

  /* ── BUBBLE ── */
  .bubble {
    position: absolute;
    pointer-events: none;
    text-align: center;
    animation: pop-out var(--dur, 3.4s) cubic-bezier(.22,1,.36,1) forwards;
    z-index: 10;
    will-change: transform, opacity;
  }
  .b-emoji {
    display: block;
    font-size: var(--es, 52px);
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.5));
  }
  .b-key {
    display: inline-block;
    margin-top: 4px;
    padding: 3px 14px;
    border-radius: 12px;
    font-weight: 900;
    font-size: var(--ks, 18px);
    font-family: 'Fredoka One', cursive;
    letter-spacing: 1px;
    border: 2px solid;
  }
  @keyframes pop-out {
    0%   { opacity: 1; transform: scale(0)   rotate(var(--rot0)) translateY(0); }
    15%  { opacity: 1; transform: scale(1.7)  rotate(calc(var(--rot0) * -0.6)) translateY(-10px); }
    30%  { opacity: 1; transform: scale(.9)   rotate(calc(var(--rot0) *  0.3)) translateY(-16px); }
    45%  { opacity: 1; transform: scale(1.05) rotate(0deg)                    translateY(-22px); }
    65%  { opacity: 1; transform: scale(1)    rotate(0deg)                    translateY(calc(var(--vy) * -0.4)); }
    100% { opacity: 0; transform: scale(.5)   rotate(var(--rot1))             translateY(var(--vy)); }
  }

  /* ── RIPPLE ── */
  .ripple {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(0);
    animation: rip .7s ease-out forwards;
    pointer-events: none; z-index: 5;
    border: 3px solid;
  }
  @keyframes rip {
    to { transform: translate(-50%,-50%) scale(3.5); opacity: 0; }
  }

  /* ── MILESTONE ── */
  .milestone {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(0);
    font-family: 'Fredoka One', cursive;
    font-size: clamp(22px, 5vw, 42px);
    color: var(--yellow);
    text-shadow: 0 0 30px #ffe06699;
    animation: mile 2.6s ease-out forwards;
    pointer-events: none; z-index: 300;
    white-space: nowrap; text-align: center;
  }
  @keyframes mile {
    0%  { opacity: 0; transform: translate(-50%,-50%) scale(.3) rotate(-10deg); }
    18% { opacity: 1; transform: translate(-50%,-55%) scale(1.4) rotate(3deg); }
    38% { opacity: 1; transform: translate(-50%,-60%) scale(1); }
    70% { opacity: 1; transform: translate(-50%,-72%); }
    100%{ opacity: 0; transform: translate(-50%,-90%) scale(.6); }
  }

  /* ── COMBO BURST ── */
  .combo-burst {
    position: absolute; left: 50%; top: 50%;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(28px, 7vw, 58px);
    color: var(--cyan);
    text-shadow: 0 0 40px var(--cyan);
    animation: combopop 1.2s ease-out forwards;
    pointer-events: none; z-index: 310;
    transform: translate(-50%,-50%);
  }
  @keyframes combopop {
    0%  { opacity: 0; transform: translate(-50%,-50%) scale(.2); }
    25% { opacity: 1; transform: translate(-50%,-50%) scale(1.5); }
    60% { opacity: 1; transform: translate(-50%,-60%) scale(1); }
    100%{ opacity: 0; transform: translate(-50%,-78%) scale(.7); }
  }

  /* ── BOTTOM TIP ── */
  #tip {
    position: absolute; bottom: 20px; left: 0; right: 0;
    text-align: center;
    font-size: clamp(12px, 2vw, 15px);
    color: rgba(255,255,255,.18);
    pointer-events: none; z-index: 50;
    letter-spacing: .5px;
  }

  /* ── SWIPE INDICATOR ── */
  #swipe-hint {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center;
    font-size: clamp(12px, 2vw, 14px);
    color: rgba(255,255,255,.22);
    pointer-events: none; z-index: 50;
    letter-spacing: .5px;
  }
  #theme-toast {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,.7);
    border: 2px solid var(--yellow);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(22px, 5vw, 36px);
    padding: 14px 32px;
    border-radius: 999px;
    pointer-events: none; z-index: 400;
    white-space: nowrap;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .25s;
    opacity: 0;
  }
  #theme-toast.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  #theme-bar {
    position: absolute; bottom: 50px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 200;
    pointer-events: all;
  }
  .theme-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.25);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(4px);
    transition: border-color .2s, transform .15s;
  }
  .theme-btn:hover  { border-color: rgba(255,255,255,.7); transform: scale(1.15); }
  .theme-btn.active { border-color: var(--yellow); transform: scale(1.15); }
</style>
</head>
<body>

<div id="stage" tabindex="0">

  <!-- star bg -->
  <div id="starfield"></div>

  <!-- hud -->
  <div id="hud">
    <div id="logo">🎹 Klaviatura Čarobnica</div>
    <div id="scorebox">
      <div class="pill" id="score-pill">⭐ 0</div>
      <div class="pill" id="combo-pill">🔥 x1</div>
    </div>
  </div>

  <!-- themes -->
  <div id="theme-bar">
    <button class="theme-btn active" data-theme="all"    title="Sve">🌈</button>
    <button class="theme-btn"        data-theme="animals" title="Životinje">🐾</button>
    <button class="theme-btn"        data-theme="food"    title="Hrana">🍕</button>
    <button class="theme-btn"        data-theme="space"   title="Svemir">🚀</button>
    <button class="theme-btn"        data-theme="faces"   title="Smajliji">😀</button>
  </div>

  <div id="tip">Pritisni bilo koji taster ili klikni mišem!</div>
  <div id="swipe-hint">← swipe za promenu teme →</div>
  <div id="theme-toast"></div>

  <!-- start overlay -->
  <div id="overlay">
    <div class="ov-emoji">🎮</div>
    <div class="ov-title">Klaviatura Čarobnica</div>
    <div class="ov-sub">Pritisni bilo koji taster na tastaturi<br>ili klikni mišem — gledaj šta se desi!</div>
    <div class="ov-particles">🐶 🌟 🍕 🚀 😎</div>
    <button id="start-btn">▶ Pokreni!</button>
  </div>

</div>

<script>
(function(){
  /* ── THEMES ── */
  const THEMES = {
    animals: ['🐶','🐱','🐻','🦊','🐸','🐮','🐷','🦁','🐯','🐨','🦄','🦋','🐝','🐙','🦀','🦉','🦜','🐬','🦈','🐳','🐧','🦒','🦓','🐘','🦔','🦩','🐢','🦎','🦖','🐊'],
    food:    ['🍎','🍊','🍋','🍇','🍓','🍒','🍉','🌽','🥕','🍦','🍕','🎂','🍩','🍭','🧁','🌮','🍔','🍟','🥑','🍌','🥝','🫐','🍑','🥦','🧇','🥞','🍿','🥨'],
    space:   ['🚀','🌟','⭐','🌙','☀️','🌈','🪐','🌍','🌕','☄️','🔭','🛸','💫','✨','🌠','🌌','🪄','💎','🔮','🌊','⚡','🌀','🎆','🎇'],
    faces:   ['😀','😎','🤩','🥳','😍','🤪','😂','🤣','😜','🥰','😇','🤓','🤠','👻','🥹','🤖','👽','🎭','🫶','🥸','😊','🤯','🤗','🙃'],
  };
  const ALL = [...THEMES.animals, ...THEMES.food, ...THEMES.space, ...THEMES.faces];
  THEMES.all = ALL;

  const KEY_LABELS = {
    ' ':'SPACE','Enter':'↵','Backspace':'⌫',
    'ArrowUp':'↑','ArrowDown':'↓','ArrowLeft':'←','ArrowRight':'→',
    'Escape':'ESC','Tab':'TAB','Shift':'⇧','Control':'CTRL',
    'Alt':'ALT','CapsLock':'CAPS','Delete':'DEL','Meta':'⊞'
  };
  const MILESTONES = {
    10:'🎉 10 karaktera!', 25:'⭐ Super! 25!',
    50:'🚀 Bravo! 50!', 100:'👑 100 – Šampion!',
    200:'🏆 200 – Legenda!'
  };
  const COLORS = ['#c77dff','#ff6bb5','#ffe066','#48dbfb','#6bcb77','#ff9f43','#ff6b6b','#4d96ff','#a8ff78','#ff8c42'];

  /* ── AUDIO ── */
  let ctx = null;
  function getCtx(){
    if(!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(ctx.state === 'suspended') { ctx.resume(); }
    return ctx;
  }
  const NOTES = [261.6,293.7,329.6,349.2,392,440,493.9,523.3,587.3,659.3,698.5,784];
  let noteIdx = 0;
  function playPop(comboVal){
    if(activeAudioNodes >= MAX_AUDIO_NODES) { return; }
    try {
      const ac = getCtx();
      const freq = NOTES[noteIdx % NOTES.length] * (1 + Math.min(comboVal-1,9)*0.03);
      noteIdx++;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      const t = ac.currentTime;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.06);
      gain.gain.setValueAtTime(0.28, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(gain);
      gain.connect(ac.destination);
      activeAudioNodes++;
      osc.start(t);
      osc.stop(t + 0.3);
      osc.onended = () => { activeAudioNodes--; };
    } catch { /* Web Audio not available */ }
  }
  function playMilestone(){
    try {
      const ac = getCtx();
      [523.3,659.3,784,1046.5].forEach((f,i)=>{
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        const t = ac.currentTime + i*0.13;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.22, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(t);
        osc.stop(t + 0.38);
      });
    } catch { /* Web Audio not available */ }
  }

  /* ── STATE ── */
  let count = 0, combo = 1, lastTime = 0, active = false, theme = 'all';
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score-pill');
  const comboEl = document.getElementById('combo-pill');
  const overlay = document.getElementById('overlay');

  /* ── STARS ── */
  const sf = document.getElementById('starfield');
  for(let i = 0; i < 120; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = 1 + Math.random() * 2.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${2+Math.random()*5}s;--dd:${(Math.random()*6).toFixed(1)}s;opacity:${.05+Math.random()*.4}`;
    sf.appendChild(s);
  }

  /* ── START ── */
  function start(){
    overlay.classList.add('hidden');
    stage.focus();
    active = true;
  }
  document.getElementById('start-btn').addEventListener('click', start);
  overlay.addEventListener('click', start);

  /* ── THEME BUTTONS ── */
  document.querySelectorAll('.theme-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const { theme: selected } = btn.dataset;
      setTheme(selected);
    });
  });

  /* ── BLOCK KEY EVENTS (keypress removed — deprecated) ── */
  ['keydown','keyup'].forEach(ev=>{
    document.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); }, true);
  });

  const MAX_BUBBLES = 60;
  let activeAudioNodes = 0;
  const MAX_AUDIO_NODES = 12;

  /* ── SPAWN ── */
  function spawn(x, y, label){
    if(stage.querySelectorAll('.bubble').length >= MAX_BUBBLES) { return; }

    const now = Date.now();
    if(now - lastTime < 60) { combo = Math.min(combo + 1, 20); }
    else { combo = 1; }
    lastTime = now;

    count++;
    scoreEl.textContent = `⭐ ${count}`;
    comboEl.textContent  = `🔥 x${combo}`;

    const pool = THEMES[theme];
    const emoji = pool[Math.floor(Math.random() * pool.length)];
    const col   = COLORS[Math.floor(Math.random() * COLORS.length)];
    const es    = 36 + Math.floor(Math.random() * 40) + Math.min(combo * 2, 20);
    const rot0  = `${Math.random() * 30 - 15}deg`;
    const rot1  = `${Math.random() * 30 - 15}deg`;
    const vy    = `${-(80 + Math.random() * 120 + combo * 4)}px`;
    const dur   = 3 + Math.random() * 1.2;

    const bx = Math.max(20, Math.min(x - 50, stage.clientWidth  - 110));
    const by = Math.max(80, Math.min(y - 60, stage.clientHeight - 160));

    /* ripple */
    const rip = document.createElement('div');
    rip.className = 'ripple';
    rip.style.cssText = `left:${x}px;top:${y}px;width:80px;height:80px;border-color:${col};opacity:.55;animation-duration:.65s`;
    stage.appendChild(rip);
    setTimeout(()=>rip.remove(), 750);

    /* bubble */
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.cssText = `left:${bx}px;top:${by}px;--es:${es}px;--ks:${Math.round(es*.38)}px;--rot0:${rot0};--rot1:${rot1};--vy:${vy};--dur:${dur}s`;

    const ec = document.createElement('span');
    ec.className = 'b-emoji';
    ec.textContent = emoji;

    const kc = document.createElement('span');
    kc.className = 'b-key';
    kc.style.cssText = `color:${col};border-color:${col};background:${col}18`;
    kc.textContent = label;

    b.appendChild(ec);
    b.appendChild(kc);
    stage.appendChild(b);
    setTimeout(()=>b.remove(), Math.round(dur*1000)+200);

    playPop(combo);

    /* milestone */
    if(MILESTONES[count]){
      const m = document.createElement('div');
      m.className = 'milestone';
      m.textContent = MILESTONES[count];
      stage.appendChild(m);
      setTimeout(()=>m.remove(), 2700);
      playMilestone();
    }

    /* combo burst */
    if(combo > 1 && combo % 5 === 0){
      const cb = document.createElement('div');
      cb.className = 'combo-burst';
      cb.textContent = `COMBO x${combo}! 🔥`;
      stage.appendChild(cb);
      setTimeout(()=>cb.remove(), 1300);
    }
  }

  function getLabel(e){
    if(KEY_LABELS[e.key]) { return KEY_LABELS[e.key]; }
    if(e.key && e.key.length === 1) { return e.key.toUpperCase(); }
    if(e.code && e.code.startsWith('F') && e.code.length <= 3) { return e.code; }
    return '★';
  }

  /* ── KEYBOARD ── */
  document.addEventListener('keydown', e=>{
    if(!active) { return; }
    const x = Math.random() * (stage.clientWidth  - 140) + 70;
    const y = Math.random() * (stage.clientHeight - 220) + 110;
    spawn(x, y, getLabel(e));
  }, true);

  /* ── MOUSE ── */
  stage.addEventListener('click', e=>{
    if(!active) { return; }
    if(e.target.closest('.theme-btn')) { return; }
    const r = stage.getBoundingClientRect();
    spawn(e.clientX - r.left, e.clientY - r.top, '★');
  });

  /* ── SWIPE TO CHANGE THEME ── */
  const THEME_ORDER = ['all','animals','food','space','faces'];
  const THEME_LABELS = { all:'🌈 Sve', animals:'🐾 Životinje', food:'🍕 Hrana', space:'🚀 Svemir', faces:'😀 Smajliji' };
  const toast = document.getElementById('theme-toast');
  let toastTimer = null;

  function setTheme(name){
    theme = name;
    document.querySelectorAll('.theme-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.theme === name);
    });
    toast.textContent = THEME_LABELS[name];
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1400);
  }

  function nextTheme(dir){
    const idx = THEME_ORDER.indexOf(theme);
    const next = THEME_ORDER[(idx + dir + THEME_ORDER.length) % THEME_ORDER.length];
    setTheme(next);
  }

  let touchStartX = 0, touchStartY = 0, touchStartTime = 0, isSwiping = false;

  stage.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
    isSwiping = false;
  }, { passive: true });

  stage.addEventListener('touchmove', e=>{
    const t = e.changedTouches[0];
    const dx = Math.abs(t.clientX - touchStartX);
    const dy = Math.abs(t.clientY - touchStartY);
    if(dx > 10 && dx > dy) { isSwiping = true; }
  }, { passive: true });

  stage.addEventListener('touchend', e=>{
    if(!active) { return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    const isSwipe = isSwiping && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 500;

    if(isSwipe){
      e.preventDefault();
      nextTheme(dx < 0 ? 1 : -1);
      return;
    }

    if(e.target.closest('.theme-btn')) { return; }
    const r = stage.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(touch=>{
      spawn(touch.clientX - r.left, touch.clientY - r.top, '★');
    });
  }, { passive: false });

})();
</script>
</body>
</html>
